<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" role="img">
<title>代码模块分层结构</title>
<desc>程序按输入层、逻辑层、数据层、渲染层四个模块组织，底层由平台适配层统一支持 Windows 与 POSIX</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="20" width="600" height="290" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="41" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">每帧调度的四个模块</text>
<rect x="60" y="58" width="270" height="105" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="78" y="86" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">输入层</text>
<text x="78" y="112" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="400" fill="#185FA5">pollTapKeys() 单次按键</text>
<text x="78" y="136" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="400" fill="#185FA5">handleInput() 移动/开火</text>
<rect x="350" y="58" width="270" height="105" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="368" y="86" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">逻辑层</text>
<text x="368" y="112" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="400" fill="#185FA5">updateShots() 我方弹药</text>
<text x="368" y="136" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="400" fill="#185FA5">updateWorld() 敌机与碰撞</text>
<rect x="60" y="178" width="270" height="105" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="78" y="206" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">数据层</text>
<text x="78" y="232" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="400" fill="#185FA5">对象池 pb/eb/en/pt/st/cr</text>
<text x="78" y="256" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="400" fill="#185FA5">WEAPONS[] 武器参数表</text>
<rect x="350" y="178" width="270" height="105" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="368" y="206" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">渲染层</text>
<text x="368" y="232" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="400" fill="#185FA5">render() → 虚拟屏幕</text>
<text x="368" y="256" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="400" fill="#185FA5">present() 整屏输出</text>
<path d="M340 310 L340 330" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
<rect x="40" y="330" width="600" height="40" rx="10" fill="#F1EFE8" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="350" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">平台适配层 · Windows: Win32 API ｜ Linux/macOS: termios + ANSI 转义</text>
</svg>
