<svg width="100%" viewBox="0 0 680 452" role="img" xmlns="http://www.w3.org/2000/svg">
<title>main 主循环每帧流程</title>
<desc>启动初始化后，循环执行读键盘、计时下落、重绘三件事</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
.ti{font:500 14px "Microsoft YaHei",sans-serif;fill:#0C447C}
.ts{font:400 12px "Microsoft YaHei",sans-serif;fill:#185FA5}
.tg{font:400 12px "Microsoft YaHei",sans-serif;fill:#5F5E5A}
</style>
<rect x="0" y="0" width="680" height="452" fill="#FFFFFF"/>
<rect x="180" y="40" width="320" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ti" x="340" y="59" text-anchor="middle" dominant-baseline="central">① 启动初始化（只做一次）</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">锁窗口字体 · resetGame · drawFrame</text>
<path d="M340 96 V124" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="180" y="124" width="320" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ti" x="340" y="143" text-anchor="middle" dominant-baseline="central">② 读键盘（while _kbhit）</text>
<text class="ts" x="340" y="162" text-anchor="middle" dominant-baseline="central">← → 移动 · ↑ 旋转 · 空格落底 · P 暂停</text>
<path d="M340 180 V208" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="180" y="208" width="320" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ti" x="340" y="227" text-anchor="middle" dominant-baseline="central">③ 自动下落（计时判断）</text>
<text class="ts" x="340" y="246" text-anchor="middle" dominant-baseline="central">间隔 = 800 − (等级−1)×70 毫秒，到期 drop()</text>
<path d="M340 264 V292" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="180" y="292" width="320" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ti" x="340" y="311" text-anchor="middle" dominant-baseline="central">④ 重绘一帧</text>
<text class="ts" x="340" y="330" text-anchor="middle" dominant-baseline="central">draw() 画全部格子 → Sleep(16)</text>
<path d="M500 320 H610 V152 H500" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="tg" x="555" y="238" text-anchor="middle" dominant-baseline="central">回到第 ② 步</text>
<text class="tg" x="340" y="374" text-anchor="middle" dominant-baseline="central">约每秒 60 帧；Esc 时跳出循环，打印“再见！”</text>
</svg>
