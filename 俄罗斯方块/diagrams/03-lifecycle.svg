<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>一个方块从生成到落定消行的生命周期</title>
<desc>生成、操作、下落、落地结算四个阶段循环进行</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
.ti{font:500 13px "Microsoft YaHei",sans-serif;fill:#0C447C}
.ts{font:400 12px "Microsoft YaHei",sans-serif;fill:#185FA5}
.tb{font:500 13px "Microsoft YaHei",sans-serif;fill:#085041}
.tg{font:400 12px "Microsoft YaHei",sans-serif;fill:#5F5E5A}
</style>
<rect x="0" y="0" width="680" height="300" fill="#FFFFFF"/>
<rect x="40" y="50" width="130" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ti" x="105" y="69" text-anchor="middle" dominant-baseline="central">spawn()</text>
<text class="ts" x="105" y="88" text-anchor="middle" dominant-baseline="central">next → cur 顶部出现</text>
<path d="M170 78 H210" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="210" y="50" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ti" x="280" y="69" text-anchor="middle" dominant-baseline="central">移动 / 旋转</text>
<text class="ts" x="280" y="88" text-anchor="middle" dominant-baseline="central">先问 collide() 撞不撞</text>
<path d="M350 78 H390" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="390" y="50" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ti" x="450" y="69" text-anchor="middle" dominant-baseline="central">drop()</text>
<text class="ts" x="450" y="88" text-anchor="middle" dominant-baseline="central">能落就 curY++</text>
<path d="M510 78 H550" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="550" y="50" width="90" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="tb" x="595" y="69" text-anchor="middle" dominant-baseline="central">落地</text>
<text class="ts" x="595" y="88" text-anchor="middle" dominant-baseline="central">不能落了</text>
<path d="M595 106 V160 H105 V106" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="tg" x="350" y="176" text-anchor="middle" dominant-baseline="central">merge() 写入 field → clearLines() 消行计分 → spawn() 下一块（循环）</text>
<text class="tg" x="340" y="228" text-anchor="middle" dominant-baseline="central">新方块在顶部生成时若 collide() 成立 → gameOver = 1</text>
</svg>
